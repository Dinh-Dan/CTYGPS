<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hoa hồng – Admin VinaGPS</title>
<link rel="stylesheet" href="/shared/css/style.css" />
<style>
.cm-toolbar {
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border);
}
.cm-toolbar .grow { flex:1; }

.cm-filter-toggle {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:#475569; cursor:pointer; user-select:none;
  padding:5px 10px; border-radius:8px; border:1px solid var(--border);
  background:#fff; transition:background .12s;
}
.cm-filter-toggle:hover { background:#f8fafc; }
.cm-filter-toggle input[type=checkbox] { width:15px; height:15px; cursor:pointer; accent-color:#6366f1; }

.cm-table-wrap { overflow-x:auto; }
.cm-table { width:100%; border-collapse:collapse; font-size:13.5px; }
.cm-table th {
  background:#f8fafc; font-weight:700; color:#475569; font-size:12px;
  text-transform:uppercase; letter-spacing:.3px; padding:8px 12px;
  border-bottom:1px solid var(--border); white-space:nowrap; text-align:left;
}
.cm-table td { padding:10px 12px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
.cm-table tr:hover td { background:#f8fafc; }
.cm-table tr.is-approved td { opacity:.6; }
.cm-amount { font-weight:700; color:#d97706; white-space:nowrap; }
.cm-meta { font-size:12px; color:#64748b; }
.cm-note { font-size:12px; color:#475569; font-style:italic; }
.cm-empty { text-align:center; padding:40px 20px; color:#94a3b8; font-style:italic; }
.action-btns { display:flex; gap:6px; }

.type-pill {
  display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px;
  font-size:11px; font-weight:700; white-space:nowrap;
}
.type-pill.ktv   { background:#dcfce7; color:#15803d; }
.type-pill.staff { background:#dbeafe; color:#1d4ed8; }

.status-pill {
  display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px;
  font-size:11px; font-weight:700; white-space:nowrap;
}
.status-pill.pending  { background:#fef3c7; color:#b45309; }
.status-pill.approved { background:#f0fdf4; color:#15803d; }

/* ── Dialog xét duyệt hoa hồng ── */
.cm-dlg-overlay {
  display:none; position:fixed; inset:0; background:rgba(15,23,42,.55);
  z-index:9100; align-items:center; justify-content:center; padding:16px;
}
.cm-dlg-overlay.open { display:flex; }
.cm-dlg {
  background:#fff; border-radius:16px; width:100%; max-width:680px;
  max-height:90vh; display:flex; flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
  animation:dlgIn .18s ease;
}
@keyframes dlgIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

.cm-dlg-header {
  display:flex; align-items:center; gap:12px; padding:16px 20px;
  border-bottom:1px solid #e2e8f0; flex-shrink:0;
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  border-radius:16px 16px 0 0;
}
.cm-dlg-title { flex:1; min-width:0; }
.cm-dlg-title .dlg-main-title { font-size:15px; font-weight:700; color:#92400e; }
.cm-dlg-title .dlg-sub-title  { font-size:12.5px; color:#b45309; margin-top:2px; }
.cm-dlg-close {
  width:32px; height:32px; border:none; background:rgba(180,83,9,.1);
  border-radius:50%; cursor:pointer; font-size:18px; color:#92400e;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:background .15s;
}
.cm-dlg-close:hover { background:rgba(180,83,9,.2); }

.cm-dlg-body { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }

.cm-dlg-loading { text-align:center; padding:40px; color:#94a3b8; font-style:italic; }

.cm-od-header {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding-bottom:12px; border-bottom:1px solid #e2e8f0;
}
.cm-od-code {
  font-size:17px; font-weight:800; color:#1e40af; text-decoration:none; letter-spacing:.3px;
}
.cm-od-code:hover { text-decoration:underline; }
.cm-od-pill {
  display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px;
  font-size:11.5px; font-weight:700; border:1px solid transparent;
}
.cm-od-pill.status-pending    { background:#f1f5f9; color:#475569; border-color:#e2e8f0; }
.cm-od-pill.status-confirmed  { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
.cm-od-pill.status-in_progress{ background:#fffbeb; color:#b45309; border-color:#fde68a; }
.cm-od-pill.status-done       { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
.cm-od-pill.status-cancelled  { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
.cm-od-pill.pay-unpaid  { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
.cm-od-pill.pay-partial { background:#fffbeb; color:#b45309; border-color:#fde68a; }
.cm-od-pill.pay-paid    { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }

.cm-od-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
}
@media (max-width:520px) { .cm-od-grid { grid-template-columns:1fr 1fr; } }
.cm-od-block {
  background:#f8fafc; border-radius:10px; padding:10px 12px;
  border:1px solid #e2e8f0;
}
.cm-od-block .blk-label { font-size:11px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
.cm-od-block .blk-val   { font-size:14px; font-weight:700; color:#0f172a; }
.cm-od-block .blk-sub   { font-size:12px; color:#64748b; margin-top:2px; }
.cm-od-block .blk-val.amount { color:#b45309; font-size:16px; }
.cm-od-block .blk-sub.debt   { color:#dc2626; font-weight:600; }

.cm-od-sec-title {
  font-size:11.5px; font-weight:700; color:#64748b; text-transform:uppercase;
  letter-spacing:.4px; margin-bottom:8px;
}
.cm-od-lines { display:flex; flex-direction:column; gap:8px; }
.cm-od-line {
  background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px;
}
.cm-od-line-name  { font-weight:700; font-size:13.5px; color:#0f172a; margin-bottom:4px; }
.cm-od-line-items { font-size:12.5px; color:#475569; line-height:1.7; }
.cm-od-line-total { font-size:12.5px; font-weight:700; color:#b45309; margin-top:4px; }

.cm-req-box {
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  border:1.5px solid #fcd34d; border-radius:12px; padding:14px 16px;
}
.cm-req-box .req-label {
  font-size:11px; font-weight:700; color:#92400e; text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:8px;
}
.cm-req-row  { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.cm-req-who  { font-size:14px; font-weight:700; color:#7c2d12; }
.cm-req-role-pill {
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;
}
.cm-req-role-pill.staff   { background:#dbeafe; color:#1d4ed8; }
.cm-req-role-pill.kithuat { background:#dcfce7; color:#15803d; }
.cm-req-amount { font-size:22px; font-weight:800; color:#b45309; margin-left:auto; }
.cm-req-note {
  font-size:12.5px; color:#7c2d12; font-style:italic; padding:6px 10px;
  background:rgba(255,255,255,.6); border-radius:7px; margin-bottom:6px;
}
.cm-req-when { font-size:11.5px; color:#92400e; }

.cm-override-wrap { margin-top:10px; padding-top:10px; border-top:1px dashed #fcd34d; }
.cm-override-wrap label { font-size:12px; color:#7c2d12; font-weight:600; margin-bottom:6px; display:block; }
.cm-override-wrap input {
  width:100%; padding:8px 12px; border:1px solid #fcd34d; border-radius:8px;
  font-size:14px; font-weight:600; background:#fff; box-sizing:border-box; outline:none;
}
.cm-override-wrap input:focus { border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.18); }

.cm-dlg-footer {
  display:flex; align-items:center; gap:8px; padding:14px 20px;
  border-top:1px solid #e2e8f0; flex-shrink:0; border-radius:0 0 16px 16px;
  background:#fff;
}
.cm-dlg-footer .spacer { flex:1; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topnav">
      <h2 class="topnav-title">Hoa hồng ⭐</h2>
      <div id="topnav-user"></div>
    </div>
    <div class="content">

      <div class="cm-toolbar">
        <label class="cm-filter-toggle">
          <input type="checkbox" id="chkShowAll" />
          Bao gồm đã duyệt
        </label>
        <div class="grow"></div>
        <span id="cmCount" style="font-size:13px;color:#64748b"></span>
        <button class="btn ghost" id="btnRefresh">↺ Làm mới</button>
      </div>

      <div class="cm-table-wrap">
        <table class="cm-table">
          <thead>
            <tr>
              <th>Loại</th>
              <th>Đơn hàng</th>
              <th>Người</th>
              <th>Khách hàng</th>
              <th>Số tiền</th>
              <th>Ghi chú</th>
              <th>Ngày gửi</th>
              <th id="thStatus" style="display:none">Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="cmTbody">
            <tr><td colspan="9" class="cm-empty">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="cmPager" style="margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:flex-end"></div>

    </div>
  </main>
</div>

<!-- Dialog xét duyệt hoa hồng -->
<div class="cm-dlg-overlay" id="cmDlg">
  <div class="cm-dlg">
    <div class="cm-dlg-header">
      <div class="cm-dlg-title">
        <div class="dlg-main-title" id="cmDlgMainTitle">Xét duyệt hoa hồng</div>
        <div class="dlg-sub-title"  id="cmDlgSubTitle"></div>
      </div>
      <button class="cm-dlg-close" id="cmDlgCloseBtn" title="Đóng">×</button>
    </div>

    <div class="cm-dlg-body" id="cmDlgBody">
      <div class="cm-dlg-loading">Đang tải...</div>
    </div>

    <div class="cm-dlg-footer">
      <button class="btn ghost" onclick="document.getElementById('cmDlg').classList.remove('open')">Đóng</button>
      <div class="spacer"></div>
      <button class="btn danger" id="cmDlgRejectBtn">✗ Từ chối</button>
      <button class="btn primary" id="cmDlgApproveBtn">✓ Duyệt hoa hồng</button>
    </div>
  </div>
</div>

<script src="/shared/js/auth.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/ui.js"></script>
<script src="/shared/js/admin-shell.js"></script>
<script src="/admin/commissions.js"></script>
</body>
</html>
