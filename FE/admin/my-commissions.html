<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hoa hồng của tôi – VinaGPS</title>
<link rel="stylesheet" href="/shared/css/style.css" />
<style>
.mc-toolbar {
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border);
}
.mc-toolbar .grow { flex:1; }

.mc-form-card {
  background:#fffbeb; border:1px solid #fde68a; border-radius:10px;
  padding:14px 16px; margin-bottom:16px;
}
.mc-form-card h4 { margin:0 0 10px; font-size:13.5px; color:#92400e; }
.mc-form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
.mc-form-row .field { flex:1; min-width:140px; }
.mc-form-row .field label { font-size:12px; color:#64748b; display:block; margin-bottom:3px; }

.mc-table-wrap { overflow-x:auto; }
.mc-table {
  width:100%; border-collapse:collapse; font-size:13.5px;
}
.mc-table th {
  background:#f8fafc; font-weight:700; color:#475569;
  font-size:12px; text-transform:uppercase; letter-spacing:.3px;
  padding:8px 12px; border-bottom:1px solid var(--border);
  white-space:nowrap; text-align:left;
}
.mc-table td { padding:10px 12px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
.mc-table tr:hover td { background:#f8fafc; }

.mc-amount { font-weight:700; color:#d97706; white-space:nowrap; }
.mc-meta { font-size:12px; color:#64748b; }
.mc-note { font-size:12px; color:#475569; font-style:italic; }
.mc-empty { text-align:center; padding:40px 20px; color:#94a3b8; font-style:italic; }

.pill-pending  { display:inline-block; background:#fef3c7; color:#92400e; border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:700; }
.pill-approved { display:inline-block; background:#d1fae5; color:#065f46; border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:700; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topnav">
      <h2 class="topnav-title">💰 Hoa hồng của tôi</h2>
      <div id="topnav-user"></div>
    </div>
    <div class="content">

      <!-- Form gửi yêu cầu mới -->
      <div class="mc-form-card">
        <h4>+ Gửi yêu cầu hoa hồng mới</h4>
        <div class="mc-form-row">
          <div class="field">
            <label>Mã đơn hàng</label>
            <input type="text" id="fOrderCode" class="input" placeholder="Nhập mã đơn (vd: DH-2024-001)" style="font-size:13px">
          </div>
          <div class="field" style="max-width:160px">
            <label>Số tiền hoa hồng (VND)</label>
            <input type="number" id="fAmount" class="input" min="0" step="1000" placeholder="0" style="font-size:13px;text-align:right">
          </div>
          <div class="field">
            <label>Ghi chú (tuỳ chọn)</label>
            <input type="text" id="fNote" class="input" maxlength="300" placeholder="Lý do yêu cầu..." style="font-size:13px">
          </div>
          <button class="btn sm" id="btnSubmit" style="margin-bottom:0">Gửi yêu cầu</button>
        </div>
        <div id="orderLookup" style="margin-top:8px;font-size:12.5px;color:#64748b"></div>
      </div>

      <div class="mc-toolbar">
        <span style="font-size:13px;color:#64748b">Danh sách yêu cầu hoa hồng đã gửi.</span>
        <div class="grow"></div>
        <button class="btn ghost" id="btnRefresh">↺ Làm mới</button>
      </div>

      <div class="mc-table-wrap">
        <table class="mc-table">
          <thead>
            <tr>
              <th>Đơn hàng</th>
              <th>Khách hàng</th>
              <th>Số tiền</th>
              <th>Ghi chú</th>
              <th>Ngày gửi</th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="mcTbody">
            <tr><td colspan="7" class="mc-empty">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="mcPager" style="margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:flex-end"></div>

    </div>
  </main>
</div>

<script src="/shared/js/auth.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/ui.js"></script>
<script src="/shared/js/admin-shell.js"></script>
<script src="/admin/my-commissions.js"></script>
</body>
</html>
