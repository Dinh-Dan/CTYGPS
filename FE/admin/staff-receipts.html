<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đối soát Nhận Tiền – Admin VinaGPS</title>
<link rel="stylesheet" href="/shared/css/style.css" />
<style>
  .pill { display:inline-flex;align-items:center;justify-content:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent; }
  .pill.green  { background:#f0fdf4;color:#15803d;border-color:#bbf7d0; }
  .pill.amber  { background:#fffbeb;color:#b45309;border-color:#fde68a; }
  .pill.gray   { background:#f1f5f9;color:#475569;border-color:#e2e8f0; }

  .filter-bar { display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;margin-bottom:12px; }
  .filter-bar .spacer { flex:1 }

  .sr-table { width:100%;border-collapse:collapse;font-size:13.5px; }
  .sr-table th { padding:9px 12px;background:#f8fafc;font-weight:600;color:#334155;border-bottom:2px solid #e2e8f0;text-align:left;white-space:nowrap; }
  .sr-table td { padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top; }
  .sr-table tr:last-child td { border-bottom:none; }
  .sr-table tr:hover td { background:#fafafa; }
  .sr-table td.num { text-align:right;font-variant-numeric:tabular-nums;font-weight:600; }
  .sr-table .ref-link { color:#2563eb;text-decoration:none;font-weight:600; }
  .sr-table .ref-link:hover { text-decoration:underline; }

  .proof-thumb { width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid #e2e8f0;cursor:pointer; }

  .summary-bar { display:flex;gap:20px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid var(--border);margin-bottom:12px;font-size:13.5px; }
  .summary-bar .sb-item { display:flex;gap:6px;align-items:center; }
  .summary-bar .sb-val { font-weight:700;color:#0f172a; }
  .summary-bar .sb-val.red { color:#dc2626; }
  .summary-bar .sb-val.green { color:#16a34a; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topnav">
      <div style="flex:1;min-width:0">
        <h2 style="font-size:17px;font-weight:700;margin:0;color:var(--text)">Đối soát Nhận Tiền</h2>
        <p style="margin:0;font-size:13px;color:#64748b">Kiểm tra các khoản nhân viên đã nhận từ khách</p>
      </div>
    </div>
    <div class="content flex-page">

      <!-- Summary bar -->
      <div class="summary-bar" id="summaryBar">
        <div class="sb-item"><span>Đang tải...</span></div>
      </div>

      <!-- Filter -->
      <div class="filter-bar">
        <select id="filterReviewed" class="select" style="width:160px">
          <option value="0">Chưa đối soát</option>
          <option value="1">Đã đối soát</option>
          <option value="">Tất cả</option>
        </select>
        <select id="filterStaff" class="select" style="width:160px">
          <option value="">Tất cả nhân viên</option>
        </select>
        <input type="date" id="filterFrom" class="input" style="width:140px" title="Từ ngày" />
        <input type="date" id="filterTo"   class="input" style="width:140px" title="Đến ngày" />
        <button class="btn ghost" id="btnClearFilter">Xoá lọc</button>
        <div class="spacer"></div>
        <button class="btn success" id="btnReviewAll" style="display:none">✓ Đối soát tất cả</button>
        <button class="btn ghost" id="btnReload">↺</button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table class="sr-table">
          <thead>
            <tr>
              <th>Mã NNT</th>
              <th>Thời gian</th>
              <th>Nhân viên</th>
              <th>Khách hàng</th>
              <th>Đơn / Phiếu</th>
              <th>Số tiền</th>
              <th>Hình thức</th>
              <th>Ghi chú</th>
              <th>Ảnh</th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="srTbody">
            <tr><td colspan="11" style="text-align:center;padding:32px;color:#94a3b8">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div id="pagination" style="display:flex;gap:8px;justify-content:flex-end;padding:12px 0;align-items:center;font-size:13px"></div>

    </div>
  </main>
</div>

<!-- Modal xem ảnh phóng to -->
<div id="imgModal" class="modal-bg" style="display:none">
  <div style="max-width:90vw;max-height:90vh;background:#000;border-radius:10px;overflow:hidden;position:relative">
    <img id="imgModalSrc" src="" alt="" style="max-width:90vw;max-height:85vh;display:block" />
    <button id="imgModalClose" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
  </div>
</div>

<script src="/shared/js/ui.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/auth.js"></script>
<script src="/shared/js/admin-shell.js"></script>
<script src="/shared/js/order-quick-view.js"></script>
<script src="/admin/staff-receipts.js"></script>
</body>
</html>
